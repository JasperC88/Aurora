[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aurora"
version = "0.1.0"
description = "Spatial Telemetry & Volumetric Sovereignty Analysis Pipeline (Taiwan ADIZ & GIUK Gap)"
authors = [{ name = "Jasper", email = "jasper@aurora.research" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0.0",
    "geopandas>=0.14.0",
    "shapely>=2.0.0",
    "pyarrow>=14.0.0",
    "dask[dataframe]>=2024.1.0",
    "trino>=0.328.0",
    "keplergl>=0.3.2",
    "psutil>=5.9.0",
    "scipy>=1.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "black>=24.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
